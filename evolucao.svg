<svg xmlns="http://www.w3.org/2000/svg" width="1148" height="360" viewBox="0 0 1148 360" role="img" aria-labelledby="title desc">

<title id="title">Tecnologias em órbita</title>

<desc id="desc">
Familiaridade autoavaliada: Python 50%, Java 20%, JavaScript 30%, HTML 50%, CSS 40%, SQL 50%, C# 50%.
Cada círculo representa uma escala independente de zero a cem.
</desc>

<defs>
